id: g1-stand
version: 0.2.0
phase: 1
runnable: true
title: G1 stand
summary: Hold the Unitree G1 home pose in MuJoCo while both arms raise and wave, and record an eval video. CPU preview, not walking RL.
language: Stand upright without falling.
robot: unitree-g1-29dof
success:
  type: upright-duration
  min_z: 0.55
  hold_s: 1.0
train:
  method: hold
  policy: keyframe-pd
  steps: 900
  seed: 1
eval:
  episodes: 1
  record_video: true
backend:
  prefer: [mujoco, playground, isaaclab]
  compute: local
adapters:
  mujoco:
    mjcf: menagerie:unitree_g1/scene.xml
    keyframe: 0
    horizon: 900
    render_every: 5
  playground:
    unsupported: "Use mujoco for the CPU stand preview. Playground is for G1 walk on GPU."
  isaaclab:
    task: Isaac-Velocity-Flat-G1-v0
    unsupported: "Stand preview runs on CPU MuJoCo. Use g1-walk for Isaac Lab locomotion."
gold:
  notes: |
    First run downloads Unitree G1 from MuJoCo Menagerie (~30MB).
    Success is pelvis height while holding the stand keyframe. Both arms
    raise and wave so the eval is not a still frame. The pelvis is pinned.
    This is not walking RL.
