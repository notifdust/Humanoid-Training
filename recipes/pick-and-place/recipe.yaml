id: pick-and-place
version: 0.5.0
phase: 2
runnable: true
title: Pick and place
summary: Record or script LeRobot demos of mustard→bowl. GPU + LeRobot runs ACT on those demos; CPU falls back to linear-BC (mocap mustard + arm poses). Not finger grasping.
language: Pick up the object and put it in the container.
robot: unitree-g1-29dof
scene:
  template: kitchen-counter-v1
  objects:
    - id: mustard
      asset: ycb-mustard
      pose: "on:counter"
      x: -0.10
      y: -0.05
    - id: bowl
      asset: bowl-white
      pose: "on:counter"
      x: 0.10
      y: 0.05
success:
  type: object-in-container
  object: mustard
  container: bowl
  hold_s: 0.5
  min_z: 0.5
data:
  min_episodes: 4
train:
  method: imitation
  policy: linear-bc
  steps: 1400
  seed: 1
eval:
  episodes: 1
  record_video: true
backend:
  prefer: [lerobot, mujoco, mjlab, isaaclab]
  compute: local
adapters:
  mujoco:
    mjcf: menagerie:unitree_g1/scene.xml
    keyframe: 0
    horizon: 1400
    render_every: 5
    honors_scene: true
    scene_preview: true
  gymnasium:
    unsupported: "Pick-and-place is not a Gymnasium environment."
  playground:
    unsupported: "Playground has no mustard-in-bowl env yet. CPU imitation uses mujoco + a LeRobot dataset."
  isaaclab:
    unsupported: "Isaac Lab manipulation launch is Phase 3."
  mjlab:
    unsupported: "mjlab pick-and-place launch is Phase 3."
  lerobot:
    policy: act
gold:
  clip: eval.mp4
  notes: |
    CPU gold is linear-BC: G1 reaches with a pick pose, then BC moves the
    mocap mustard toward the bowl while the arm blends lift→place poses.
    Pelvis pinned. Same demos feed ACT when LeRobot + GPU are present
    (facts.policy=act). Not finger grasping. Bad demos fail mustard_bowl_dist.
studio:
  availability: cpu
  start_here: true
  promise: Mustard slides into the bowl. The arm follows. Not finger grasping.
  train_hint: On CPU you see mustard move into the bowl with linear-BC. On a GPU box with LeRobot, Train launches ACT on the same demos. Neither is finger grasping.
  scene_hint: Top-down kitchen counter. Drag mustard if you want. Train still works if you do not.
  record_hint: Show the robot the task. Drag mustard, or steer with WASD / a gamepad, uncheck the bad takes, then Train. Same demos feed linear-BC or ACT.
