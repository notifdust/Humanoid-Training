id: pick-and-place
version: 0.4.0
phase: 2
runnable: true
title: Pick and place
summary: Drag mustard and bowl, record LeRobot demos, train CPU behavioral cloning. G1 reaches with a seed pose + Jacobian IK, then carries mocap mustard into the bowl. Not finger grasping, not ACT.
language: Pick up the object and put it in the container.
robot: unitree-g1-29dof
scene:
  template: kitchen-counter-v1
  objects:
    - id: mustard
      asset: ycb-mustard
      pose: "on:counter"
      x: -0.10
      y: -0.05
    - id: bowl
      asset: bowl-white
      pose: "on:counter"
      x: 0.08
      y: 0.04
success:
  type: object-in-container
  object: mustard
  container: bowl
  hold_s: 0.5
  min_z: 0.5
data:
  min_episodes: 4
train:
  method: imitation
  policy: linear-bc
  steps: 1800
  seed: 1
eval:
  episodes: 1
  record_video: true
backend:
  prefer: [mujoco, lerobot, mjlab, isaaclab]
  compute: local
adapters:
  mujoco:
    mjcf: menagerie:unitree_g1/scene.xml
    keyframe: 0
    horizon: 1800
    render_every: 10
    honors_scene: true
    scene_preview: true
  gymnasium:
    unsupported: "Pick-and-place is not a Gymnasium environment."
  playground:
    unsupported: "Playground has no mustard-in-bowl env yet. CPU imitation uses mujoco + a LeRobot dataset."
  isaaclab:
    unsupported: "Isaac Lab manipulation launch is Phase 3."
  mjlab:
    unsupported: "mjlab pick-and-place launch is Phase 3."
  lerobot:
    policy: act
    unsupported: "Full ACT needs the lerobot package and a GPU. CPU linear-BC runs on the mujoco adapter from the same LeRobot dataset."
gold:
  notes: |
    Train writes scripted object-space demos if none are imported, fits
    linear BC, then G1 reaches (seed pose + right-arm IK), carries the
    mocap mustard, and sets it in the bowl. The counter sits in the
    standing G1 wrist workspace. Not finger grasping and not ACT.
