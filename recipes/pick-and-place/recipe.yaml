id: pick-and-place
version: 0.3.0
phase: 2
runnable: true
title: Pick and place
summary: Drag mustard and bowl, record LeRobot demos, train CPU behavioral cloning. G1 stands in the scene; the object motion is scripted, not a grasped pick.
language: Pick up the object and put it in the container.
robot: unitree-g1-29dof
scene:
  template: kitchen-counter-v1
  objects:
    - id: mustard
      asset: ycb-mustard
      pose: "on:counter"
      x: -0.18
      y: 0.04
    - id: bowl
      asset: bowl-white
      pose: "on:counter"
      x: 0.16
      y: -0.02
success:
  type: object-in-container
  object: mustard
  container: bowl
  hold_s: 0.5
  min_z: 0.5
data:
  min_episodes: 4
train:
  method: imitation
  policy: linear-bc
  steps: 180
  seed: 1
eval:
  episodes: 1
  record_video: true
backend:
  prefer: [mujoco, lerobot, mjlab, isaaclab]
  compute: local
adapters:
  mujoco:
    mjcf: menagerie:unitree_g1/scene.xml
    keyframe: 0
    horizon: 120
    render_every: 3
    honors_scene: true
    scene_preview: true
  gymnasium:
    unsupported: "Pick-and-place is not a Gymnasium environment."
  playground:
    unsupported: "Playground has no mustard-in-bowl env yet. CPU imitation uses mujoco + a LeRobot dataset."
  isaaclab:
    unsupported: "Isaac Lab manipulation launch is Phase 3."
  mjlab:
    unsupported: "mjlab pick-and-place launch is Phase 3."
  lerobot:
    policy: act
    unsupported: "Full ACT needs the lerobot package and a GPU. CPU linear-BC runs on the mujoco adapter from the same LeRobot dataset."
gold:
  notes: |
    Train writes scripted object-space demos (LeRobot v2 layout) if none are
    imported, fits linear BC, and evals mustard-in-bowl in MuJoCo. That is
    the imitation loop, not G1 grasping and not ACT.
