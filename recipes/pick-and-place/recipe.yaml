id: pick-and-place
version: 0.2.0
phase: 2
runnable: true
title: Pick and place
summary: Drop G1 at a kitchen counter, drag mustard and bowl, preview the composed MuJoCo scene. Imitation from demos is still Phase 2.
language: Pick up the object and put it in the container.
robot: unitree-g1-29dof
scene:
  template: kitchen-counter-v1
  objects:
    - id: mustard
      asset: ycb-mustard
      pose: "on:counter"
      x: -0.18
      y: 0.04
    - id: bowl
      asset: bowl-white
      pose: "on:counter"
      x: 0.16
      y: -0.02
success:
  type: object-in-container
  hold_s: 0.5
  min_z: 0.5
train:
  method: imitation
  policy: lerobot.act
  steps: 80000
  seed: 1
eval:
  episodes: 20
  record_video: true
backend:
  prefer: [mujoco, lerobot, mjlab, isaaclab]
  compute: local
adapters:
  mujoco:
    mjcf: menagerie:unitree_g1/scene.xml
    keyframe: 0
    horizon: 180
    render_every: 3
    honors_scene: true
    scene_preview: true
  gymnasium:
    unsupported: "Pick-and-place is not a Gymnasium environment."
  playground:
    unsupported: "Playground has no mustard-in-bowl env yet. CPU preview uses mujoco; imitation is Phase 2."
  isaaclab:
    unsupported: "Isaac Lab manipulation launch is Phase 3. Spec is kept so the mustard example still expands."
  mjlab:
    unsupported: "mjlab pick-and-place launch is Phase 3. CPU scene preview uses mujoco."
  lerobot:
    policy: act
    unsupported: "Imitation from demos is Phase 2. Import a LeRobot dataset in the Data room. This recipe previews the scene on CPU MuJoCo."
gold:
  notes: |
    Runnable today = G1 + table + dragged primitives in MuJoCo, eval.mp4.
    That is a scene preview, not a trained pick. Success is "objects where you
    put them and the robot still standing," not "mustard in bowl."
