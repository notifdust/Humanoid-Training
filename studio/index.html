<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Humanoid Training Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand">
          <span class="mark">HT</span>
          <div>
            <strong>Humanoid Training</strong>
            <p>Studio · compile a spec, don’t reinvent physics</p>
          </div>
        </div>
        <div class="meta" id="health">connecting…</div>
      </header>
      <div class="shell">
        <nav class="rail" aria-label="Studio rooms">
          <button class="rail-btn" data-view="robots">Robots</button>
          <button class="rail-btn active" data-view="tasks">Tasks</button>
          <button class="rail-btn" data-view="data">Data</button>
          <button class="rail-btn" data-view="runs">Runs</button>
        </nav>
        <main id="main"></main>
      </div>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
